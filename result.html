<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Academic Result Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3c72, #2a5298);
            --success-gradient: linear-gradient(135deg, #11998e, #38ef7d);
            --danger-gradient: linear-gradient(135deg, #ff416c, #ff4b2b);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * { padding: 0; margin: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            background-color: #f4f7fa;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* আধুনিক ফুল-পেজ লোডার */
        .loader {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none; justify-content: center; align-items: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            z-index: 9999;
        }
        .circular_loader {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #2a5298;
            border-radius: 50%;
            animation: load 0.8s linear infinite;
        }

        /* হেডার ব্যানার */
        .top_container {
            background: var(--primary-gradient);
            box-shadow: 0 4px 20px rgba(30, 60, 114, 0.25);
            border-radius: 0 0 24px 24px;
        }
        #logo {
            height: 70px; width: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.6);
            object-fit: cover;
        }
        .heading_txt {
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        /* মডার্ন ফিল্টার কার্ড */
        .main-card {
            background: #ffffff;
            border: none;
            border-radius: 18px;
            box-shadow: var(--card-shadow);
            padding: 24px;
        }
        .form-label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-select, .input_text {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 15px;
            color: #334155;
            transition: var(--transition);
            width: 100%;
        }
        .form-select:focus, .input_text:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
            outline: none;
        }

        /* সার্চ বাটন */
        .btn-modern {
            background: var(--primary-gradient);
            border: none; color: white;
            padding: 12px 35px; font-weight: 600;
            border-radius: 10px; box-shadow: 0 4px 15px rgba(42, 82, 152, 0.3);
            transition: var(--transition);
        }
        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(42, 82, 152, 0.4);
            color: white;
        }

        /* স্টুডেন্ট প্রোফাইল কার্ড */
        .profile-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: none;
        }
        .profile-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px;
        }
        .badge-status {
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            display: inline-block;
        }
        .badge-passed { background: #d1fae5; color: #065f46; }
        .badge-failed { background: #fee2e2; color: #991b1b; }

        /* আধুনিক টেবিল ডিজাইন */
        .table-responsive-custom {
            border-radius: 0 0 16px 16px;
            overflow: hidden;
        }
        .table { margin-bottom: 0; }
        .table thead { background: #f1f5f9; }
        .table thead th {
            color: #475569; font-weight: 700; border: none; padding: 14px; font-size: 15px;
        }
        .table tbody tr { transition: var(--transition); vertical-align: middle; }
        .table tbody tr:hover { background-color: #f8fafc; }
        .table td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; color: #334155; }

        .footer-txt { font-size: 13px; color: #64748b; line-height: 1.6; }

        @keyframes load { 100% { transform: rotate(360deg); } }

        @media screen and (max-width: 768px) {
            .heading_txt { font-size: 1.15rem; text-align: center; }
            #logo { height: 50px; width: 50px; }
            .main-card { padding: 16px; }
            .table td, .table th { padding: 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

  <div class="loader"><div class="circular_loader"></div></div>

  <div class="top_container container-fluid px-3 py-3 mb-4">
        <div class="row">
            <div class="col-12 d-flex flex-column flex-sm-row justify-content-center align-items-center text-white heading_txt fw-bold gap-3">
              <img id="logo" src="logo.jpg" alt="Logo"/>
              <div class="text-center text-sm-start">পীরগঞ্জ সরকারি টেকনিক্যাল স্কুল ও কলেজ</div>
           </div>
        </div>     
  </div>

  <div class="container mb-4">
      <div class="main-card">
          <div class="row g-3">
              <div class="col-12 text-center mb-2">
                  <h4 class="fw-bold text-dark m-0">Academic Result Portal</h4>
              </div>
              <div class="col-12 col-md-6 col-lg-3">
                  <label class="form-label">পরীক্ষার নাম</label>
                  <select id="select_exam" class="form-select">
                        <option value="1">বর্ষমধ্য পরীক্ষা</option>
                        <option value="2">বার্ষিক পরীক্ষা</option>
                  </select>
              </div>
              <div class="col-12 col-md-6 col-lg-3">
                  <label class="form-label">সাল</label>
                  <select id="select_year" class="form-select">
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                        <option value="2029">2029</option>
                        <option value="2030">2029</option>
                  </select>
              </div>
              <div class="col-12 col-md-6 col-lg-2">
                  <label class="form-label">শ্রেণি</label>
                  <select id="select_cls" class="form-select">
                        <option value="class_6">6</option>
                        <option value="class_7">7</option>
                        <option value="class_8">8</option>
                        <option value="class_9">9</option>
                        <option value="class_10">10</option>
                        <option value="class_9">9</option>
                        <option value="class_10">10</option>
                  </select>
              </div>
              <div class="col-12 col-md-6 col-lg-2">
                  <label class="form-label">শাখা / ট্রেড</label>
                  <select id="select_sec" class="form-select">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="A">Apparel</option>
                         <option value="C">Civil</option>
                        <option value="E">Electronics</option>
                        <option value="W">Welding</option>
                  </select>
              </div>
              <div class="col-12 col-md-12 col-lg-2">
                  <label class="form-label">রোল নম্বর</label>
                  <input id="cls_roll" class="input_text" type="tel" placeholder="Enter Roll" />
              </div>
              <div class="col-12 d-flex justify-content-center mt-4">
                  <button class="btn btn-modern px-5" onclick="">Show Result</button>
              </div>
          </div>
      </div>
  </div>

<div class="container">
   <div class="card text-center py-2 text-danger fw-bold"> সকল বিষয়ের Marks এখনো জমা হয় নাই!!!</div>
   <div class="w-100 d-flex justify-content-center py-4"><a href="index.html" class="btn btn-secondary">Back to Home</a> </div>
</div>



  <div class="container mb-5">
      <div id="resultCard" class="profile-card">
          <div class="profile-header">
              <div class="row align-items-center g-3">
                  <div class="col-12 col-md-6 text-center text-md-start">
                      <h3 id="stu_name" class="fw-bold text-dark mb-1">-</h3>
                      <div id="stu_roll" class="text-muted fw-semibold">Class Roll: -</div>
                  </div>
                  <div class="col-12 col-md-6 text-center text-md-end">
                      <div id="stu_result" class="mb-2"></div>
                      <div id="stu_marks" class="fw-bold text-secondary"></div>
                  </div>
              </div>
          </div>
          
          <div class="table-responsive-custom">
                <table class="table">
                  <thead>
                    <tr>
                      <th width="15%">SL</th>
                      <th width="45%">বিষয়ের নাম</th>
                      <th width="20%">পূর্ণ নম্বর</th>
                      <th width="20%">প্রাপ্ত নম্বর</th>
                    </tr>
                  </thead>
                  <tbody id="tbdy"></tbody>
                </table>
          </div>
      </div>
  </div>
 
  <div class="container text-center mt-auto pb-4 footer-txt"> 
       <div class="fw-bold text-dark">Developed By Jiten Chandra Roy</div>
       <div>Instructor (Civil) | Pirganj Govt. Technical School & College</div>
       <div class="text-muted">Pirganj, Thakurgaon</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const selectSec = document.getElementById('select_sec');
  const selectCls = document.getElementById('select_cls');
  const inputRoll = document.getElementById('cls_roll');
  const loader = document.querySelector(".loader");
  const resultCard = document.getElementById("resultCard");

  // ⚠️ আপনার Google Apps Script Web App URL-টি এখানে রিপ্লেস করুন
  const API_URL = "https://script.google.com/macros/s/AKfycbxnWA0bDbedCxMSNms35AUNFBREuCFrLj7bHMJAYW1wGxw6-V_EidSf4RnzE_qWtJFSvA/exec"; 


  async function fetchResult(){
      if(!inputRoll.value.trim()){
          alert("অনুগ্রহ করে রোল নম্বর প্রদান করুন।");
          return;
      }

      loader.style.display = "flex";
      resultCard.style.display = "none";

      const url = `${API_URL}?action=getResult&class=${selectCls.value}&section=${selectSec.value}&roll=${inputRoll.value.trim()}&_=${new Date().getTime()}`;

      try {
          const response = await fetch(url);
          if(!response.ok) throw new Error("Network response error");
          
          const dt = await response.json();
          showMarksTable(dt);
      } catch (error) {
          console.error(error);
          alert("রেজাল্ট লোড করতে কোনো সমস্যা হয়েছে অথবা সঠিক ডেটা পাওয়া যায়নি!");
          loader.style.display = "none";
      }
  }

function showMarksTable(dta){
    document.getElementById("tbdy").innerHTML = "";
    
    if(!dta || dta.length === 0 || !dta[0].name) {
        alert("প্রদত্ত রোল নম্বরের কোনো ফলাফল পাওয়া যায়নি।");
        loader.style.display = "none";
        return;
    }

    var student = dta[0];
    var html = ``;

    // স্টুডেন্ট বায়ো ও সামারি ডেটা সেট করা
    document.getElementById('stu_name').textContent = student.name;
    document.getElementById('stu_roll').textContent = "Class Roll - " + student.roll;
    
    // রেজাল্ট স্ট্যাটাস ব্যাজ হ্যান্ডেল করা
    if(student.mposition === "Failed" || student.result_lg === "F"){
       document.getElementById('stu_result').innerHTML = `<span class="badge-status badge-failed">❌ Result: Failed</span>`;
    } else {
       var posText = student.mposition ? ` & Merit: ${student.mposition}` : '';
       document.getElementById('stu_result').innerHTML = `<span class="badge-status badge-passed">GPA: ${student.result_gp || 'Passed'}${posText}</span>`;
    }

    // প্রাপ্ত নম্বর ও মোট নম্বর প্রদর্শন
    if (student.ob_marks) {
        document.getElementById('stu_marks').textContent = "প্রাপ্ত নম্বর: " + student.ob_marks + " / " + (student.ttl_marks || "N/A");
    } else {
        document.getElementById('stu_marks').textContent = "মোট নম্বর: " + (student.total_marks || "-");
    }

    // ফেল করা বিষয় (১/৩ এর কম) হাইলাইট করার সংশোধিত লজিক (বুটস্ট্র্যাপ ক্লাস ব্যবহার করে)
    function checkFailClass(obtained, fullMark) {
        var mark = parseFloat(obtained);
        var total = parseFloat(fullMark);
        
        // যদি ডাটা না থাকে বা পূর্ণ নম্বর ০ হয়, তবে কোনো ক্লাস যোগ হবে না
        if (isNaN(mark) || isNaN(total) || total <= 0) return ""; 
        
        // ১/৩ এর কম পেলে বুটস্ট্র্যাপের টেবিল-ডেঞ্জার এবং টেক্সট-ডেঞ্জার ক্লাস যুক্ত হবে
        return mark < (total / 3) ? 'class="table-danger text-danger fw-bold"' : '';
    }

    // ক্লাস ওয়াইজ মার্কস টেবিল রো জেনারেট করা
    if(selectCls.value === "class_6" || selectCls.value === "class_7" || selectCls.value === "class_8"){
        html = `
          <tr ${checkFailClass(student.sub_1_mark, student.sub_1_flmk)}><td>1</td><td>বাংলা ১ম</td><td>${student.sub_1_flmk || 0}</td><td>${student.sub_1_mark || 0}</td></tr>
          <tr ${checkFailClass(student.sub_2_mark, student.sub_2_flmk)}><td>2</td><td>বাংলা ২য়</td><td>${student.sub_2_flmk || 0}</td><td>${student.sub_2_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_3_mark, student.sub_3_flmk)}><td>3</td><td>ইংরেজি ১ম</td><td>${student.sub_3_flmk || 0}</td><td>${student.sub_3_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_4_mark, student.sub_4_flmk)}><td>4</td><td>ইংরেজি ২য়</td><td>${student.sub_4_flmk || 0}</td><td>${student.sub_4_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_5_mark, student.sub_5_flmk)}><td>5</td><td>গণিত</td><td>${student.sub_5_flmk || 0}</td><td>${student.sub_5_mark || 0}</td></tr>       
          <tr ${checkFailClass(student.sub_6_mark, student.sub_6_flmk)}><td>6</td><td>বিজ্ঞান</td><td>${student.sub_6_flmk || 0}</td><td>${student.sub_6_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_7_mark, student.sub_7_flmk)}><td>7</td><td>বাংলাদেশ ও বি.প.</td><td>${student.sub_7_flmk || 0}</td><td>${student.sub_7_mark || 0}</td></tr> 
          <tr ${checkFailClass(student.sub_8_mark, student.sub_8_flmk)}><td>8</td><td>কর্মমুখী</td><td>${student.sub_8_flmk || 0}</td><td>${student.sub_8_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_9_mark, student.sub_9_flmk)}><td>9</td><td>ধর্ম</td><td>${student.sub_9_flmk || 0}</td><td>${student.sub_9_mark || 0}</td></tr>`;         
    }
    else if(selectCls.value === "class_9" || selectCls.value === "class_10"){
        html = `
          <tr ${checkFailClass(student.sub_1_mark, 20)}><td>1</td><td>বাংলা</td><td>20</td><td>${student.sub_1_mark || 0}</td></tr>
          <tr ${checkFailClass(student.sub_2_mark, 20)}><td>2</td><td>ইংরেজি</td><td>20</td><td>${student.sub_2_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_3_mark, 20)}><td>3</td><td>গণিত</td><td>20</td><td>${student.sub_3_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_4_mark, 10)}><td>4</td><td>বাংলাদেশ ও বি. প.</td><td>10</td><td>${student.sub_4_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_5_mark, 10)}><td>5</td><td>পদার্থ</td><td>10</td><td>${student.sub_5_mark || 0}</td></tr>       
          <tr ${checkFailClass(student.sub_6_mark, 10)}><td>6</td><td>রসায়ন</td><td>10</td><td>${student.sub_6_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_8_mark, 10)}><td>7</td><td>ড্রয়িং/আত্মকর্ম</td><td>10</td><td>${student.sub_8_mark || 0}</td></tr>     
          <tr ${checkFailClass(student.sub_9_mark, 20)}><td>8</td><td>ধর্ম</td><td>20</td><td>${student.sub_9_mark || 0}</td></tr> 
          <tr ${checkFailClass(student.sub_10_mark, 20)}><td>9</td><td>ট্রেড - ১</td><td>20</td><td>${student.sub_10_mark || 0}</td></tr>
          <tr ${checkFailClass(student.sub_11_mark, 20)}><td>10</td><td>ট্রেড - ২</td><td>20</td><td>${student.sub_11_mark || 0}</td></tr>
          <tr ${checkFailClass(student.sub_12_mark, 15)}><td>11</td><td>চতুর্থ বিষয়</td><td>15</td><td>${student.sub_12_mark || 0}</td></tr>`;         
    }

    document.getElementById("tbdy").innerHTML = html;
    loader.style.display = "none";
    resultCard.style.display = "block";
  }


</script>
</body>
</html>
